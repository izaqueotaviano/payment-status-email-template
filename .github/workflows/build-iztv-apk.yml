name: Build iztv APK

on:
  push:
    branches:
      - claude/android-iptv-tv-app-d83xei
    paths:
      - 'iptv-tv-player/**'
      - '.github/workflows/build-iztv-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          # Platforms are sometimes published with a minor-revision suffix
          # (e.g. "platforms;android-37.2"), not just a bare integer, and
          # only the highest minor revision may actually be installable.
          # Exclude betas/RCs - only real stable minor revisions.
          PACKAGES="$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-[0-9]+(\.[0-9]+)?' | grep -v -- '-beta\|-rc' | sort -t- -k2 -rV -u)"
          echo "=== candidate platform packages (highest first) ==="
          echo "$PACKAGES"

          INSTALLED_LEVEL=""
          for pkg in $PACKAGES; do
            echo "--- trying $pkg (stable channel) ---"
            if "$SDKMANAGER" "$pkg" > /tmp/sdk_install.log 2>&1 && ! grep -q "Failed to find package" /tmp/sdk_install.log; then
              INSTALLED_LEVEL="${pkg#platforms;android-}"
              INSTALLED_LEVEL="${INSTALLED_LEVEL%%.*}"
              echo "Installed $pkg -> compileSdk $INSTALLED_LEVEL"
              break
            fi
            cat /tmp/sdk_install.log
            echo "--- trying $pkg (canary channel) ---"
            if "$SDKMANAGER" --channel=3 "$pkg" > /tmp/sdk_install.log 2>&1 && ! grep -q "Failed to find package" /tmp/sdk_install.log; then
              INSTALLED_LEVEL="${pkg#platforms;android-}"
              INSTALLED_LEVEL="${INSTALLED_LEVEL%%.*}"
              echo "Installed $pkg (canary channel) -> compileSdk $INSTALLED_LEVEL"
              break
            fi
            cat /tmp/sdk_install.log
          done

          if [ -z "$INSTALLED_LEVEL" ]; then
            echo "Could not install any Android platform." >&2
            exit 1
          fi

          BUILD_TOOLS="$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'build-tools;[0-9.]+' | sort -t';' -k2 -V -u | tail -1)"
          echo "Installing $BUILD_TOOLS"
          "$SDKMANAGER" "$BUILD_TOOLS"

          echo "ANDROID_COMPILE_SDK=$INSTALLED_LEVEL" >> "$GITHUB_ENV"

      - name: Match compileSdk/targetSdk to the installed platform
        working-directory: iptv-tv-player
        run: |
          sed -i "s/compileSdk = [0-9]\+/compileSdk = ${ANDROID_COMPILE_SDK}/" app/build.gradle.kts
          sed -i "s/targetSdk = [0-9]\+/targetSdk = ${ANDROID_COMPILE_SDK}/" app/build.gradle.kts
          grep -E "compileSdk|targetSdk" app/build.gradle.kts

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        working-directory: iptv-tv-player
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: iptv-tv-player
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: iptv-tv-player
        run: cp app/build/outputs/apk/release/app-release.apk iztv.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iztv-latest
          name: iztv (build automático)
          body: |
            APK gerado automaticamente pelo GitHub Actions a partir do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Instale via sideload: pelo app Downloader (Android TV / Fire TV) usando a URL do arquivo `iztv.apk`
            abaixo, ou via `adb install iztv.apk`. É preciso habilitar "Fontes desconhecidas" no aparelho antes.
          files: iptv-tv-player/iztv.apk
          make_latest: true
