name: Build iztv APK

on:
  push:
    branches:
      - claude/android-iptv-tv-app-d83xei
    paths:
      - 'iptv-tv-player/**'
      - '.github/workflows/build-iztv-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          LEVELS="$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'platforms;android-[0-9]+' | grep -oE '[0-9]+' | sort -rn -u)"
          echo "=== candidate platform levels (highest first) ==="
          echo "$LEVELS"

          INSTALLED_LEVEL=""
          for level in $LEVELS; do
            echo "--- trying platforms;android-$level ---"
            if "$SDKMANAGER" "platforms;android-$level" > /tmp/sdk_install.log 2>&1 && ! grep -q "Failed to find package" /tmp/sdk_install.log; then
              INSTALLED_LEVEL="$level"
              echo "Installed platforms;android-$level"
              break
            fi
            cat /tmp/sdk_install.log
          done

          if [ -z "$INSTALLED_LEVEL" ]; then
            echo "Could not install any Android platform." >&2
            exit 1
          fi

          BUILD_TOOLS="$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'build-tools;[0-9.]+' | sort -t';' -k2 -V -u | tail -1)"
          echo "Installing $BUILD_TOOLS"
          "$SDKMANAGER" "$BUILD_TOOLS"

          echo "ANDROID_COMPILE_SDK=$INSTALLED_LEVEL" >> "$GITHUB_ENV"

      - name: Match compileSdk/targetSdk to the installed platform
        working-directory: iptv-tv-player
        run: |
          sed -i "s/compileSdk = [0-9]\+/compileSdk = ${ANDROID_COMPILE_SDK}/" app/build.gradle.kts
          sed -i "s/targetSdk = [0-9]\+/targetSdk = ${ANDROID_COMPILE_SDK}/" app/build.gradle.kts
          grep -E "compileSdk|targetSdk" app/build.gradle.kts

      - name: Print current Google Maven versions (diagnostic)
        run: |
          for coord in \
            "androidx/tv/tv-foundation" \
            "androidx/tv/tv-material" \
            "androidx/compose/compose-bom" \
            "androidx/media3/media3-exoplayer" \
            "androidx/room/room-runtime" \
            "androidx/datastore/datastore-preferences" \
            "androidx/navigation/navigation-compose" \
            "androidx/lifecycle/lifecycle-runtime-ktx" \
            "androidx/activity/activity-compose" \
            "androidx/core/core-ktx" \
            "com/android/tools/build/gradle" \
          ; do
            echo "=== $coord ==="
            meta="$(curl -s "https://dl.google.com/dl/android/maven2/$coord/maven-metadata.xml")"
            echo "$meta" | grep -oE '<release>[^<]+</release>|<latest>[^<]+</latest>' || true
            echo "last 3 stable:"
            echo "$meta" | grep -oE '<version>[^<]+</version>' | sed -E 's/<\/?version>//g' \
              | grep -Ev -- '-alpha|-beta|-rc|-dev|-M[0-9]' | tail -3 || true
          done

      - name: Print current Gradle versions (diagnostic)
        run: curl -s https://services.gradle.org/versions/current

      - name: Print current Kotlin/KSP versions (diagnostic)
        run: |
          echo "=== kotlin-gradle-plugin (last 5 stable) ==="
          curl -s "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | sed -E 's/<\/?version>//g' \
            | grep -Ev -- '-M|-RC|-Beta|-dev|-eap' | tail -5 || true
          echo "=== ksp symbol-processing-gradle-plugin (last 10) ==="
          curl -s "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | sed -E 's/<\/?version>//g' | tail -10 || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        working-directory: iptv-tv-player
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: iptv-tv-player
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: iptv-tv-player
        run: cp app/build/outputs/apk/release/app-release.apk iztv.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iztv-latest
          name: iztv (build automático)
          body: |
            APK gerado automaticamente pelo GitHub Actions a partir do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Instale via sideload: pelo app Downloader (Android TV / Fire TV) usando a URL do arquivo `iztv.apk`
            abaixo, ou via `adb install iztv.apk`. É preciso habilitar "Fontes desconhecidas" no aparelho antes.
          files: iptv-tv-player/iztv.apk
          make_latest: true
