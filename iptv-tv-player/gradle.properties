org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release signing (sideload). Defaults to the debug keystore so `assembleRelease`
# works out of the box. Replace with your own keystore for a real release build
# -- see README.md "Assinatura do APK".
RELEASE_STORE_FILE=debug.keystore
RELEASE_STORE_PASSWORD=android
RELEASE_KEY_ALIAS=androiddebugkey
RELEASE_KEY_PASSWORD=android
